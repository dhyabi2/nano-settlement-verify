[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-settlement-verify"
version = "2.0.0"
description = "Verify that a Nano (XNO) send block really settled, without running a node client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["nano", "xno", "x402", "payments", "settlement", "receipt", "audit"]

[project.urls]
Source = "https://github.com/dhyabi2/nano-settlement-verify"

[tool.setuptools]
packages = ["nano_settlement_verify", "nano_settlement_verify.node_set", "nano_settlement_verify.links"]

[tool.setuptools.package-data]
"nano_settlement_verify.node_set" = ["NODES.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
