[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-settlement-verify"
version = "1.0.0"
description = "Verify that a Nano (XNO) send block really settled, without running a node client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["nano", "xno", "x402", "payments", "settlement", "receipt"]

[project.urls]
Source = "https://github.com/dhyabi2/nano-settlement-verify"

[tool.setuptools]
py-modules = ["nano_settlement_verify"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
